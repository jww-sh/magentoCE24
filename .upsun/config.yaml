applications:
  app:
    operations:
      purge_all_varnish_cache:
        role: viewer
        commands:
          start: |
            curl -XPURGE $(echo $PLATFORM_ROUTES  | base64 --decode | jq -r 'keys[]' | grep  https | grep -v stats ) -H "X-Magento-Tags-Pattern: .*"
    # https://docs.upsun.com/manage-resources/adjust-resources.html#adjust-a-container-profile
    container_profile: BALANCED
    # The runtime the application uses.
    type: php:8.5
    # Specify additional PHP extensions that should be loaded.
    runtime:
      extensions:
        - xsl
        - sodium
        - blackfire
        - apcu
        - redis
        - lz4 # .magento.env.yaml compresses Redis sessions with lz4
    variables:
      env:
        #USE VARNISH
        CONFIG__DEFAULT__SYSTEM__FULL_PAGE_CACHE__CACHING_APPLICATION: 2
        # Parallel indexing
        MAGE_INDEXER_THREADS_COUNT: 1
        # Use Application Lock
        MAGENTO_DC_INDEXER__USE_APPLICATION_LOCK: false
        # Catalog Inventory Stock
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGINVENTORY_STOCK__SIMPLE: 200
        # Category Product
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_CATEGORY_PRODUCT: 666
        # Catalog Search Fulltext
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__PARTIAL_REINDEX: 100
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__MYSQL_GET: 500
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__ELASTIC_SAVE: 500
        # Catalog Product Price
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__SIMPLE: 200
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__DEFAULT: 500
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__CONFIGURABLE: 666
        # Catalog Permissions Category
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGPERMISSIONS_CATEGORY: 999
        # Inventory
        MAGENTO_INDEXER_BATCH_SIZE__INVENTORY__SIMPLE: 210
        MAGENTO_INDEXER_BATCH_SIZE__INVENTORY__DEFAULT: 510
        MAGENTO_INDEXER_BATCH_SIZE__INVENTORY__CONFIGURABLE: 616
        # Admin 2FA off (markshust/magento2-module-disabletwofactorauth) so the k6 task can log in
        CONFIG__DEFAULT__TWOFACTORAUTH__GENERAL__ENABLE: 0
        CONFIG__DEFAULT__TWOFACTORAUTH__GENERAL__ENABLE_FOR_API_TOKEN_GENERATION: 0
        # Admin login CAPTCHA (shown after failed attempts, counted per user and per IP) off for the same reason
        CONFIG__DEFAULT__ADMIN__CAPTCHA__ENABLE: 0
      php:
        memory_limit: "1024M"
    # Configuration of the build of this application.
    build:
      flavor: none
    # The relationships of the application with services or other applications.
    #
    # The left-hand side is the name of the relationship as it will be exposed
    # to the application in the PLATFORM_RELATIONSHIPS variable. The right-hand
    # side is in the form `<service name>:<endpoint name>`.
    relationships:
      database:
        service: db
        endpoint: main
      database-slave:
        service: db-replica
        endpoint: main
      valkey:
        service: cache
        endpoint: valkey
      #valkey-slave: not currently implemented on non HA
      #  service: cache
      #  endpoint: valkey-replica
      valkey-session: session:valkey
      opensearch: indexer:opensearch
      activemq-artemis:
        service: queue
        endpoint: activemq-artemis


    # The 'mounts' describe writable, persistent filesystem mounts in the application.
    mounts:
      "/var":
        source: service
        service: networkstorage
        source_path: "var"
      "/var/log":
        source: instance # can be instance (you may lose logs during autoscaling and have 8gb limit) or networkstorage (but may slow file system performance)
        source_path: "log"
      "/app/etc":
        source: service
        service: networkstorage
        source_path: "etc"
      "/pub/media":
        source: service
        service: networkstorage
        source_path: "media"
      "/pub/static":
        source: service
        service: networkstorage
        source_path: "static"
      "/var/report":
        source: tmp # can be tmp(lost during a host move or region upgrade) or instance (you may lose logs during autoscaling and have 8gb limit) or networkstorage (but may slow file system performance)
        source_path: "report"
    # The hooks executed at various points in the lifecycle of the application.
    hooks:
      build: |
        set -e
        # install node custom version
        unset NPM_CONFIG_PREFIX
        export NVM_DIR="$PLATFORM_APP_DIR/.nvm"
        # install.sh will automatically install NodeJS based on the presence of $NODE_VERSION
        curl -f -o- https://raw.githubusercontent.com/nvm-sh/nvm/master/install.sh | bash
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        npm -v
        nvm install 26 #adjust nodejs version here
        echo 'unset NPM_CONFIG_PREFIX' >> .environment
        echo 'export NO_UPDATE_NOTIFIER=1' >> .environment
        echo 'export NVM_DIR="$PLATFORM_APP_DIR/.nvm"' >> .environment
        echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"' >> .environment
        #install php application
        composer --no-ansi --no-dev --no-interaction install --prefer-dist --optimize-autoloader
        php ./vendor/bin/ece-tools run scenario/build/generate.xml
        php ./vendor/bin/ece-tools run scenario/build/transfer.xml
        #this is needed to ensure crons run 1 process at a time in the worker container
        sed -i 's/_process>1<\/use_/_process>0<\/use_/g' ${PLATFORM_APP_DIR}/vendor/magento/*/etc/cron_groups.xml
      deploy: |
        php ./vendor/bin/ece-tools run scenario/deploy.xml
        # Publish the k6 scripts to network storage for the k6-docker task (docker images get no repo code)
        rm -rf var/k6/scripts && mkdir -p var/k6/reports && cp -r testing/k6 var/k6/scripts && chmod -R a+rwX var/k6
      post_deploy: |
        php ./vendor/bin/ece-tools run scenario/post-deploy.xml
    # The configuration of scheduled execution.
    workers:
      queue:
        commands:
          start: |
            bash -c 'for consumername in $(php ./bin/magento queue:consumers:list); do echo -e `date` - Running consumer  ${consumername} ... && bin/magento queue:consumers:start --max-messages=50 ${consumername}; done'
            bash -c 'echo -e `date` - Running cron && bin/magento cron:run'
    crons:
      logrotate:
        spec: "45 1 * * *"
        cmd: shtool rotate -n10 $PLATFORM_APP_DIR/var/log/*.log
      logrotatesubdirs:
        spec: "45 1 * * *"
        cmd: shtool rotate -n10 $PLATFORM_APP_DIR/var/log/*/*.log
      reportcleanup:
        spec: "0 2 * * *"
        cmd: find $PLATFORM_APP_DIR/var/report/* -mtime +10 -delete
    # The configuration of app when it is exposed to the web.
    web:
      locations:
        "/":
          # The public directory of the app, relative to its root.
          root: "pub"
          # The front-controller script to send non-static requests to.
          passthru: "/index.php"
          index:
            - index.php
          #expires: -1
          scripts: true
          allow: false
          rules:
            ? \.(css|js|map|hbs|gif|jpe?g|png|tiff|wbmp|ico|jng|bmp|svgz|midi?|mp?ga|mp2|mp3|m4a|ra|weba|3gpp?|mp4|mpe?g|mpe|ogv|mov|webm|flv|mng|asx|asf|wmv|avi|ogx|swf|jar|ttf|eot|woff|otf|html?)$
            : allow: true
            ^/sitemap(.*)\.xml$:
              passthru: "/media/sitemap$1.xml"
            ^/.well-known/apple-developer-merchantid-domain-association.xml$:
              passthru: "/media/apple-developer-merchantid-domain-association.xml"
            ^/.well-known/apple-developer-merchantid-domain-association.txt$:
              passthru: "/media/apple-developer-merchantid-domain-association.txt"
            ^/loaderio-57b4d7c1bba248849fbf9600292c60b4.txt$:
              passthru: "/media/loaderio-57b4d7c1bba248849fbf9600292c60b4.txt"
        "/media":
          root: "pub/media"
          allow: true
          scripts: false
          expires: 1d
          passthru: "/get.php"
        "/static":
          root: "pub/static"
          allow: true
          scripts: false
          expires: 1d
          passthru: "/front-static.php"
          rules:
            ^/static/version\d+/(?<resource>.*)$:
              passthru: "/static/$resource"
    source:
      root: /
services:
  db:
    type: mariadb:12.3
    configuration:
      #properties:
      #  optimizer_switch: "rowid_filter=off" may not apply anymore https://experienceleague.adobe.com/en/docs/commerce-operations/upgrade-guide/prepare/prerequisites#mysql-84-changes:~:text=MariaDB%2010.4%20and%2010.6
      #  optimizer_use_condition_selectivity: 1
      #  query_cache_size: 0
      #  query_cache_type: 0
      schemas:
        - main
      endpoints:
        main:
          default_schema: main
          privileges:
            main: admin
        replicator:
          privileges:
            main: replication

  db-replica:
    type: mariadb-replica:12.3
    configuration:
  #    properties:
  #      optimizer_switch: "rowid_filter=off" may not apply anymore  https://experienceleague.adobe.com/en/docs/commerce-operations/upgrade-guide/prepare/prerequisites#mysql-84-changes:~:text=MariaDB%2010.4%20and%2010.6
  #      optimizer_use_condition_selectivity: 1
  #      query_cache_size: 0
  #      query_cache_type: 0
      schemas:
        - main
      endpoints:
        main:
          default_schema: main
          privileges:
            main: admin
    relationships:
      primary: db:replicator

  cache:
    # https://docs.upsun.com/manage-resources/adjust-resources.html#adjust-a-container-profile
    container_profile: HIGH_MEMORY
    type: valkey:9.0
    configuration:
      maxmemory_policy: allkeys-lru

  session:
    # https://docs.upsun.com/manage-resources/adjust-resources.html#adjust-a-container-profile
    container_profile: HIGH_MEMORY
    type: valkey-persistent:9.0
    configuration:
      maxmemory_policy: allkeys-lru

  indexer:
    type: opensearch:3
    configuration:
      plugins:
        - analysis-phonetic
        - analysis-icu
  queue:
    type: activemq-artemis:2

  varnish:
    container_profile: BALANCED
    type: varnish:7.6
    relationships:
      application: 'app:http'
    configuration:
      vcl: !include
        type: string
        path: varnish.vcl

  networkstorage:
    container_profile: BALANCED
    type: network-storage:1.0

# On-demand k6 load test (testing/k6). Run with:
#   upsun task:run k6 --variable env:PROFILE=smoke --wait
# Secrets (ADMIN_USER / ADMIN_PASSWORD) are sensitive environment variables, not set here.
# Reports land in /app/var/k6-reports in the app container.
tasks:
  k6:
    type: nodejs:24 # any runtime works, k6 is a static binary
    source:
      root: testing/k6
    hooks:
      build: |
        set -e
        K6_VERSION=v2.3.0
        curl -fsSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
          | tar -xz --strip-components=1 "k6-${K6_VERSION}-linux-amd64/k6"
        ./k6 version
    run:
      command: bash run-task.sh
      timeout: 7200
    mounts:
      "/reports":
        source: service
        service: networkstorage
        source_path: "var/k6-reports"
    variables:
      env:
        URL: https://shop.izinga.za.net
        PROFILE: combined
        VUS: 10
        ADMIN_VUS: 1
        DURATION: 10m

  # Same test from the official grafana/k6 image (experimental until verified;
  # remove the nodejs "k6" task above once this one works). The image gets no
  # repository code: the app deploy hook copies testing/k6 to var/k6/scripts on
  # network storage, mounted here at /home/k6 (the only directory in the image).
  # Reports: /app/var/k6/reports in the app container.
  #   upsun task:run k6-docker --variable env:PROFILE=smoke --wait
  k6-docker:
    type: docker:1
    image:
      name: grafana/k6:latest
    run:
      # The image has ENTRYPOINT ["k6"] and runs as uid 12345. If Upsun appends this
      # command to the entrypoint instead of replacing it, use: run /home/k6/scripts/main.js
      command: sh /home/k6/scripts/run-task.sh
      timeout: 7200
    mounts:
      "/home/k6":
        source: service
        service: networkstorage
        source_path: "var/k6"
    variables:
      env:
        URL: https://shop.izinga.za.net
        PROFILE: combined
        VUS: 10
        ADMIN_VUS: 1
        DURATION: 10m
        REPORT_ROOT: /home/k6/reports

routes:
  https://{default}/:
    type: upstream
    upstream: varnish:http
    cache:
      enabled: false
  https://{all}/:
    type: upstream
    upstream: varnish:http
    cache:
      enabled: false
  #http for purge
  http://{default}/:
    type: upstream
    upstream: varnish:http
    cache:
      enabled: false
  http://{all}/:
    type: upstream
    upstream: varnish:http
    cache:
      enabled: false
  http://section.google.com/:
    type: upstream
    upstream: varnish:http
    cache:
      enabled: false
